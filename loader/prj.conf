#
# This file contains selected Kconfig options for the application.

CONFIG_USERSPACE=n
CONFIG_ARM_MPU=n

CONFIG_LOG=y

CONFIG_HEAP_MEM_POOL_SIZE=60000
CONFIG_MAIN_STACK_SIZE=5000

CONFIG_ARDUINO_API=y

CONFIG_SHELL=n
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=2048
CONFIG_SHELL_LOG_LEVEL_DBG=y

CONFIG_LLEXT=y
CONFIG_LLEXT_LOG_LEVEL_INF=y
CONFIG_LLEXT_HEAP_SIZE=8
CONFIG_LLEXT_SHELL=n
CONFIG_LLEXT_STORAGE_WRITABLE=y
CONFIG_LLEXT_EXPORT_DEVICES=y

CONFIG_LLEXT_EDK=y
CONFIG_LLEXT_EDK_FORMAT_TAR_ZSTD=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=n

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_CBPRINTF_COMPLETE=y

CONFIG_OUTPUT_DISASSEMBLY=y
CONFIG_OUTPUT_SYMBOLS=y
