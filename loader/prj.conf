# This file contains selected Kconfig options for the application.

CONFIG_USERSPACE=n
CONFIG_ARM_MPU=n

CONFIG_LOG=y

CONFIG_HEAP_MEM_POOL_SIZE=60000
CONFIG_MAIN_STACK_SIZE=5000

CONFIG_ARDUINO_API=y

CONFIG_LLEXT=y
CONFIG_LLEXT_LOG_LEVEL_INF=y
CONFIG_LLEXT_HEAP_SIZE=8
CONFIG_LLEXT_STORAGE_WRITABLE=y
CONFIG_LLEXT_EXPORT_DEVICES=y

CONFIG_LLEXT_EDK=y
CONFIG_LLEXT_EDK_FORMAT_TAR_ZSTD=y

CONFIG_GPIO=y
CONFIG_GPIO_GET_DIRECTION=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_SPI=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_MAIN_THREAD_PRIORITY=14

CONFIG_EVENTS=y

CONFIG_OUTPUT_DISASSEMBLY=y
CONFIG_OUTPUT_SYMBOLS=y